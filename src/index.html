<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; font-src 'self' file: data:; img-src 'self' file: data:; connect-src https://api.open-meteo.com https://geocoding-api.open-meteo.com">
  <title>Clock Weather</title>
  <link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-sans/300.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-sans/400.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-sans/500.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-mono/400.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wordmark">
      <span class="brand-symbol" aria-hidden="true">◷</span>
      <span class="wordmark-name">Clock Weather</span>
      <span class="wordmark-utc" id="utc-now"></span>
    </div>
    <nav class="topbar-actions">
      <div class="view-switch" role="group">
        <button class="text-btn" data-view="list" data-i18n="viewList"></button>
        <button class="text-btn" data-view="dials" data-i18n="viewDials"></button>
      </div>
      <button class="text-btn" id="btn-add" data-i18n="addCity"></button>
      <button class="text-btn" id="btn-settings" data-i18n="settings"></button>
      <button class="icon-btn" id="btn-theme" data-i18n-title="theme"></button>
      <button class="icon-btn" id="btn-full" data-i18n-title="fullscreen"></button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-text">
        <div class="eyebrow" data-i18n="localTime"></div>
        <div class="hero-place">
          <span class="hero-city" id="hero-city"></span>
          <span class="hero-zone" id="hero-zone"></span>
        </div>
        <div class="hero-time" id="hero-time"></div>
        <div class="hero-date" id="hero-date"></div>
      </div>
      <div class="hero-side">
        <div class="hero-wx" id="hero-wx"></div>
        <div class="sun-times" id="hero-sun"></div>
      </div>
      <div class="hero-dial" id="hero-dial"></div>
      <div class="hero-day">
        <div class="band big" id="hero-band"><div class="band-now"></div></div>
        <div class="scale"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
      </div>
    </section>

    <div class="section-heading"><h1 data-i18n="worldClocks"></h1><span data-i18n="worldSubtitle"></span></div>
    <section id="cities" aria-label="World clocks"></section>
  </main>

  <footer class="status">
    <span id="status-text"></span>
    <button class="text-btn" id="btn-refresh" data-i18n="refresh"></button>
    <button class="text-btn" id="btn-info" data-i18n="about"></button>
  </footer>

  <dialog id="search-dialog" class="modal">
    <div class="modal-head">
      <h2 id="search-title"></h2>
      <button class="icon-btn" data-close></button>
    </div>
    <input id="search-input" type="search" autocomplete="off" spellcheck="false">
    <ul id="search-results" class="results"></ul>
  </dialog>

  <dialog id="settings-dialog" class="panel">
    <div class="modal-head">
      <h2 data-i18n="settings"></h2>
      <button class="icon-btn" data-close></button>
    </div>
    <div id="settings-body"></div>
  </dialog>

  <dialog id="about-dialog" class="modal">
    <div class="modal-head">
      <h2 data-i18n="about"></h2>
      <button class="icon-btn" data-close></button>
    </div>
    <div id="about-body" class="about"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
